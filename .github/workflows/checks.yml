name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_pac.cjs
      - run: node --check extension/background.js
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/check_installer.ps1
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./install.ps1 -LocalSource . -InstallDir "$env:RUNNER_TEMP/PathfinderInstall" -NoLaunch
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/check_packet_component.ps1 -InstallDir "$env:RUNNER_TEMP/PathfinderInstall"
